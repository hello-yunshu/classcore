services:
  classroom-server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.server
    image: classroom-runtime:local
    ports:
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:8788:8788"
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      LOCAL_TOOLS_HOST: 0.0.0.0
      LOCAL_TOOLS_PORT: 8788
      CLASSROOM_DATA_DIR: /data
    volumes:
      - classroom-data:/data
    restart: unless-stopped
volumes:
  classroom-data:
